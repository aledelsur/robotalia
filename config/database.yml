# PostgreSQL 16. Defaults match the postgres service in docker-compose.yml.
default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("POSTGRES_HOST", "127.0.0.1") %>
  port: <%= ENV.fetch("POSTGRES_PORT", 5432) %>
  username: <%= ENV.fetch("POSTGRES_USER", "postgres") %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD", "postgres") %>

development:
  <<: *default
  database: robotalia_development

# The test database is erased on each run. Never point it at development data.
test:
  <<: *default
  database: robotalia_test

production:
  <<: *default
  database: robotalia_production
  username: robotalia
  password: <%= ENV["ROBOTALIA_DATABASE_PASSWORD"] %>
