# Deployed with Kamal 2: web, Sidekiq, PostgreSQL and Redis on a single server.
#
# This repo is public, so the server address stays out of it. It comes from the environment,
# like the hostname: bin/kamal loads both from .env.deploy (see .env.deploy.example).
service: robotalia
image: robotalia

servers:
  web:
    - <%= ENV.fetch("ROBOTALIA_SERVER_IP") %>
  job:
    hosts:
      - <%= ENV.fetch("ROBOTALIA_SERVER_IP") %>
    cmd: bundle exec sidekiq

# kamal-proxy terminates TLS with a Let's Encrypt certificate. The DNS record must point
# straight at the server (on Cloudflare: "DNS only").
proxy:
  ssl: true
  host: <%= ENV.fetch("ROBOTALIA_HOST") %>
  app_port: 80
  healthcheck:
    path: /up

# Kamal runs a local registry and the server pulls through SSH, so no registry account is needed.
registry:
  server: localhost:5555

builder:
  arch: amd64

ssh:
  user: root
  keys:
    - ~/.ssh/robotalia_ed25519
  keys_only: true

env:
  clear:
    APP_HOST: <%= ENV.fetch("ROBOTALIA_HOST") %>
    POSTGRES_HOST: robotalia-db
    REDIS_URL: redis://robotalia-redis:6379/0
    SIDEKIQ_CONCURRENCY: 3
    # Production holds only synthetic data, so uploading a report is switched off.
    IMPORTS_ENABLED: "false"
  secret:
    - RAILS_MASTER_KEY
    - ROBOTALIA_DATABASE_PASSWORD

# Neither accessory publishes a port: only containers on Kamal's network can reach them.
accessories:
  db:
    image: postgres:16
    host: <%= ENV.fetch("ROBOTALIA_SERVER_IP") %>
    env:
      clear:
        POSTGRES_USER: robotalia
        POSTGRES_DB: robotalia_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data
  redis:
    image: redis:7
    host: <%= ENV.fetch("ROBOTALIA_SERVER_IP") %>
    cmd: redis-server --appendonly yes
    directories:
      - data:/data

volumes:
  - "robotalia_storage:/rails/storage"

# Bridge fingerprinted assets between versions to avoid 404s on in-flight requests.
asset_path: /rails/public/assets

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"
