# Local development. `docker compose up` runs everything;
# `bin/dev` uses only postgres and redis from this file.

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile.dev
  image: robotalia-dev
  environment:
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    REDIS_URL: redis://redis:6379/0
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    OWNER_EMAIL: ${OWNER_EMAIL:-owner@example.com}
    OWNER_PASSWORD: ${OWNER_PASSWORD:-}
  volumes:
    # The source mount includes storage/, so web and sidekiq see the same uploads.
    - .:/rails
    - bundle:/usr/local/bundle
    # Private to each container, so host and container pid files never collide.
    - /rails/tmp/pids

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    <<: *app
    command: bash -c "bundle check || bundle install; bin/rails db:prepare tailwindcss:build && exec bin/rails server -b 0.0.0.0"
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/up"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  css:
    <<: *app
    command: bin/rails "tailwindcss:watch[always]"
    depends_on:
      web: { condition: service_healthy }

  sidekiq:
    <<: *app
    command: bundle exec sidekiq -C config/sidekiq.yml
    depends_on:
      web: { condition: service_healthy }

volumes:
  postgres_data:
  redis_data:
  bundle:
